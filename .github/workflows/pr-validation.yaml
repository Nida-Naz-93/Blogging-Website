name: Pull Request Validation
on:
  pull_request:
    branches:
      - develop
jobs:
  linting-job:
    name: Lint HTML and CSS Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install HTMLHint
        run: npm install --save-dev htmlhint
      - name: Install Stylelint
        run: npm install --save-dev stylelint
      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"
      - name: Lint CSS Files
        run: npx stylelint "**/*.css"
      - name: Display Package.json Contents
        run: cat package.json

  build-job:
    name: Build Static Website
    needs: linting-job
    runs-on: ubuntu-latest
    steps:
      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"
      - name: Lint CSS Files
        run: npx stylelint "**/*.css"
      - name: Install Dependencies
        run: |
        npm install --save-dev htmlhint stylelint parcel-bundler
      - name: Build Website
        run: parcel build "./src/index.html" --dist-dir "./dist"
